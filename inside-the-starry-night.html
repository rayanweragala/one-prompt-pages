<script type="text/plain" id="promptSrc">
Create an absolutely breathtaking, immersive, explorable world inspired by Vincent van Gogh’s *The Starry Night*. This must not feel like a regular painting, website, or game, but like **stepping inside a living masterpiece**.

Imagine someone who deeply loves *The Starry Night* finally getting to enter it. Begin with the iconic view of the painting, then let them freely look around, rotate 360°, walk through the peaceful village, explore hidden paths, climb hills, and discover the beautiful world Van Gogh never showed us.

**Capture the soul of the painting:** enormous swirling skies, glowing golden stars, deep cobalt blues, expressive oil-paint brushstrokes, rolling hills, mysterious cypress trees, and tiny houses with warm windows. Everything should have depth and feel genuinely made of living paint, not ordinary 3D objects with an artistic filter. The sky should slowly breathe and swirl, stars should shimmer gently, and the environment should feel quietly alive.

**Emotion is everything.** Make visitors feel wonder, peace, nostalgia, gentle loneliness, curiosity, and awe. Create unforgettable viewpoints and subtle discoveries. Every direction should reveal something beautiful. The atmosphere should feel like a quiet, magical dream beneath an infinite universe.

**Mobile-first experience:** buttery-smooth performance, intuitive touch exploration, natural camera movement, responsive portrait and landscape layouts, minimal controls, and absolutely no wasted screen space. Use every pixel as part of the artwork. Desktop should feel equally immersive.

**You have complete technical and creative freedom.** Choose whichever technologies, rendering techniques, and architecture produce the most beautiful and performant result. Build a complete, working, polished interactive experience—not a mockup or simple animated background.

Think like a world-class digital artist, creative director, and engineer. Obsess over composition, lighting, atmosphere, painterly textures, movement, and tiny details. Avoid generic game visuals, excessive effects, and unnecessary UI.

**The ultimate goal:** Someone opens this on their phone, recognizes their favorite painting, turns around to discover a world they never knew existed, and forgets they're looking at a screen.

Make it so beautiful they want to stay there forever.

**Don't just recreate *The Starry Night*. Let people live inside it.**

const dirOf=(az,el)=>{az*=DEG;el*=DEG;return[Math.sin(az)*Math.cos(el),Math.sin(el),-Math.cos(az)*Math.cos(el)];};

      for(let k=0;k<n;k++){const th=(k+R(.6))/n*TAU,rr=rad*R(.94,1.06),c=Math.cos(th),s=Math.sin(th);

    }
    const q=Math.hypot(v.x,v.y),rt=[-v.y/q,v.x/q],up=[-v.x/q,-v.y/q],sc=v.sc*DEG;
    const at=(a,b)=>[v.x+(rt[0]*a+up[0]*b)*sc,v.y+(rt[1]*a+up[1]*b)*sc];
    if(moon){
      for(let i=0;i<7;i++){const a=R(TAU),r=i?R(.5,1.2):0;skyStroke(at(Math.cos(a)*r+.5,Math.sin(a)*r),[1,0],0,1.5*sc,1.3*DEG,vary(H('#f8e37c'),.06),.6,-1,0,1,v.ph);}
      for(const[rho,a0,a1,w]of[[2.15,104,256,.8],[1.6,128,232,.75],[1.15,150,210,.6]])for(let a=a0;a<=a1;a+=rho>2?11:15){

    if(P.u.uTime)gl.uniform1f(P.u.uTime,tm);if(P.u.uW)gl.uniform4f(P.u.uW,WC[0],WC[1],1/(2*WE),WE);if(P.u.uHF)gl.uniform1i(P.u.uHF,1);if(P.u.uCT)gl.uniform1i(P.u.uCT,2);};
  common(P_TERR);gl.bindVertexArray(vTerr.v);gl.drawElements(gl.TRIANGLES,vTerr.n,gl.UNSIGNED_SHORT,0);
  common(P_SOLID);gl.bindVertexArray(vSolid.v);gl.drawArrays(gl.TRIANGLES,0,vSolid.n);
  common(P_RING);gl.bindVertexArray(vRing.v);P=P_RING;
  for(const[tile,len,wid,mode,f0,f1,n]of[[2*WE,5.2,1.25,1,22,105,40000],[180,2.4,.6,0,6,19,14000],[44,.92,.27,0,.3,1.6,15000]]){
    gl.uniform4f(P.u.uRing,tile,len,wid,mode);gl.uniform2f(P.u.uFade,f0,f1);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,n);}
  common(P_STATIC);gl.bindVertexArray(vStatic.v);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,vStatic.n);
  const ma=time-markT;
  if(ma<2.4){const k=Math.sin(Math.min(1,ma/2.4)*Math.PI);for(let i=0;i<14;i++)markD[i*16+7]=.2*k;
    gl.bindVertexArray(vMark.v);gl.bindBuffer(gl.ARRAY_BUFFER,vMark.b);gl.bufferSubData(gl.ARRAY_BUFFER,0,markD);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,14);}
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,Hh);gl.disable(gl.DEPTH_TEST);
  P=P_POST;gl.useProgram(P.p);gl.activeTexture(gl.TEXTURE3);gl.bindTexture(gl.TEXTURE_2D,fTex);gl.uniform1i(P.u.uS,3);gl.uniform1i(P.u.uN,0);
  gl.uniform2f(P.u.uTexel,1/fw,1/fh);gl.uniform2f(P.u.uAsp,aspect(),1);gl.uniform1f(P.u.uTime,time);gl.uniform1f(P.u.uFade,fade);gl.uniform1f(P.u.uBoil,REDUCED?0:1.7*scale);gl.uniform1f(P.u.uDpr,dpr);
  gl.bindVertexArray(vFull);gl.drawArrays(gl.TRIANGLES,0,3);
}
function loop(now){
  requestAnimationFrame(loop);if(document.hidden)return;
  const raw=(now-last)/1000;last=now;const dt=Math.min(.05,Math.max(0,raw));
  time+=dt;fade=Math.min(1,fade+dt*.45);
  if(!lockQ&&raw<.5){            // keep it smooth: paint the scene smaller if the device is struggling
    if(raw>.024){slow++;fast=0;}else if(raw<.0125){fast++;slow=Math.max(0,slow-1);}else{slow=Math.max(0,slow-1);fast=0;}
    if(slow>35&&scale>.45){scale=Math.max(.45,scale*.84);slow=0;sizeFBO();}
    else if(fast>420&&scale<(coarse?.8:1)){scale=Math.min(1,scale*1.1);fast=0;sizeFBO();}
  }
  resize();step(dt);draw();places(dt);
}

/* ---------------- words, sound, the small amount of interface ---------------- */
const cap=$('#cap'),hint=$('#hint');let capT=0,placeT=0;
function say(t){cap.innerHTML='';cap.append(t);const s=document.createElement('small');s.textContent='Vincent, in a letter';cap.append(s);cap.classList.add('on');capT=11;hint.classList.remove('on');chime();}
function places(dt){
  if(!inside)return;
  if(capT>0){capT-=dt;if(capT<=0)cap.classList.remove('on');}
  if(walked>12&&hint.classList.contains('on'))hint.classList.remove('on');
  placeT-=dt;if(placeT>0||capT>-3&&capT!==0&&capT>0)return;placeT=.4;
  if(time-enterT<6)return;
  for(const s of SPOTS)if(!s.seen&&Math.hypot(cam.x-s.x,cam.z-s.z)<s.r){s.seen=1;say(s.t);break;}
}
let AC=null,master=null,muted=false,crick=0;
function audioStart(){
  if(AC||muted)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=0;master.connect(AC.destination);master.gain.linearRampToValueAtTime(.6,AC.currentTime+5);
  const len=AC.sampleRate*5,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let b=0;
  for(let i=0;i<len;i++){b=(b+.02*(Math.random()*2-1))/1.02;d[i]=b*3.2;}
  for(let i=0;i<4000;i++){const k=i/4000;d[i]=d[i]*k+d[len-4000+i]*(1-k);}
  for(const[fq,q,gn,lf]of[[340,.6,.2,.07],[900,1.2,.05,.11]]){const src=AC.createBufferSource();src.buffer=buf;src.loop=true;src.playbackRate.value=fq>500?1.3:1;
    const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=fq;f.Q.value=q;const g=AC.createGain();g.gain.value=gn;
    const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=lf;lg.gain.value=gn*.7;l.connect(lg);lg.connect(g.gain);l.start();
    src.connect(f);f.connect(g);g.connect(master);src.start();}
  for(const[fq,gn]of[[73.42,.05],[110,.035],[146.83,.022],[220.4,.012]]){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=fq;g.gain.value=gn;
    const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=.03+Math.random()*.05;lg.gain.value=gn*.6;l.connect(lg);lg.connect(g.gain);l.start();o.connect(g);g.connect(master);o.start();}
  crick=setInterval(()=>{if(!AC||AC.state!=='running'||Math.random()<.35)return;const t=AC.currentTime+.05,o=AC.createOscillator(),g=AC.createGain(),p=AC.createStereoPanner?AC.createStereoPanner():null;
    o.frequency.value=3900+Math.random()*900;g.gain.value=0;const n=2+(Math.random()*3|0),v=.006+Math.random()*.012;
    for(let i=0;i<n;i++){g.gain.setValueAtTime(0,t+i*.075);g.gain.linearRampToValueAtTime(v,t+i*.075+.012);g.gain.linearRampToValueAtTime(0,t+i*.075+.05);}
    o.connect(g);if(p){p.pan.value=Math.random()*2-1;g.connect(p);p.connect(master);}else g.connect(master);o.start(t);o.stop(t+n*.08+.1);},900);
}
function chime(){
  if(!AC||muted)return;const t=AC.currentTime,notes=[293.66,369.99,440,554.37,659.25,880],st=(Math.random()*3)|0;
  [0,1,3].forEach((k,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=notes[st+k];
    g.gain.setValueAtTime(0,t+i*.42);g.gain.linearRampToValueAtTime(.07,t+i*.42+.05);g.gain.exponentialRampToValueAtTime(.0005,t+i*.42+4.5);
    o.connect(g);g.connect(master);o.start(t+i*.42);o.stop(t+i*.42+4.6);});
}
const snd=$('#snd');
snd.addEventListener('click',()=>{muted=!muted;snd.setAttribute('aria-pressed',String(!muted));
  if(!muted&&!AC)audioStart();else if(master)master.gain.setTargetAtTime(muted?0:.6,AC.currentTime,.4);cv.focus();});
document.addEventListener('visibilitychange',()=>{if(AC)document.hidden?AC.suspend():AC.resume();last=performance.now();});

const veil=$('#veil'),brief=$('#brief');let briefOpen=false,ready=false;
function setBrief(v){briefOpen=v;brief.classList.toggle('open',v);brief.setAttribute('aria-hidden',String(!v));if(v)$('#briefX').focus();}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
$('#briefBody').innerHTML=$('#promptSrc').textContent.trim().split(/\n\s*\n/).map(p=>'<p>'+esc(p).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')+'</p>').join('');
$('#briefBtn').addEventListener('click',e=>{e.stopPropagation();setBrief(true);});
$('#briefX').addEventListener('click',()=>setBrief(false));brief.addEventListener('click',e=>{if(e.target===brief)setBrief(false);});
if(/prompt/.test(location.hash))setBrief(true);
function enter(){
  if(!ready||inside)return;inside=true;enterT=time;veil.classList.add('gone');snd.classList.add('on');audioStart();cv.focus();
  hint.textContent=coarse?'drag to look · tap to walk · hold to wander':'drag to look · click to walk · W A S D';
  setTimeout(()=>hint.classList.add('on'),2600);setTimeout(()=>hint.classList.remove('on'),15000);
}
veil.addEventListener('click',enter);

/* ---------------- begin ---------------- */
setTimeout(()=>{
  buildSky();buildWorld();buildGround();upload();resize();
  cam.y=hf(0,0)+EYE;
  if(Q.has('go')){inside=true;enterT=time-9;fade=1;veil.style.display='none';
    cam.x=+Q.get('x')||0;cam.z=+Q.get('z')||0;cam.yaw=cam.yawT=(+Q.get('yaw')||0)*DEG;cam.pitch=cam.pitchT=(+Q.get('pitch')||0)*DEG;cam.y=hf(cam.x,cam.z)+EYE;}
  if(Q.has('shot')){fade=1;veil.style.display='none';}
  if(Q.has('dbg'))window.__sn={cam,get scale(){return scale;},get target(){return target;}};
  ready=true;veil.classList.add('ready');$('#go').textContent=coarse?'touch to step inside':'click to step inside';
  last=performance.now();requestAnimationFrame(loop);
},60);
})();
</script>
