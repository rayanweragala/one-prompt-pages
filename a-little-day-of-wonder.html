# A LITTLE DAY OF WONDER
### A living, interactive picture book about a child's curiosity

Create an extraordinarily beautiful, interactive, hand-painted storybook following a curious **6-year-old child through an ordinary morning that becomes a journey of little discoveries**.

Imagine opening a cherished childhood picture book, except the paintings are alive. Sunlight slowly enters a bedroom, curtains move in the breeze, birds sing outside, and every ordinary object might contain a fascinating secret.

**This is not a game, educational dashboard, or conventional website. It is a living illustrated storybook.**

## The Story

**Scene 1 — Good Morning, Little World**

A child wakes up in a cozy bedroom filled with warm morning sunlight. An old-fashioned clock ticks beside the bed.

The visitor can touch the clock to bring it closer, move its hands, and discover how time works. As the hands rotate, the time changes naturally, accompanied by friendly written explanations such as "Seven o'clock" and "Half past seven." Make the relationship between the hour hand, minute hand, and passing time visually understandable.

Perhaps turning the clock forward makes the sunlight move across the bedroom. The room itself gently responds to time.

**Scene 2 — The Magic Inside Breakfast**

The child enters a beautiful, sunlit kitchen. Bread is being toasted.

What happens inside a toaster?

Let the visitor open the toaster through a delightful lift-the-flap or cutaway animation, revealing the heating elements, electricity flowing through the heating circuit, and the mechanism that releases the toast.

Make it visually fascinating, mechanically understandable, and scientifically accurate without overwhelming a young child.

Watch the bread slowly turn golden before popping up with a satisfying little sound.

**Scene 3 — The Street Has Secrets**

The child walks outside into a charming illustrated neighborhood. Trees sway, bicycles pass, and a traffic light stands beside a pedestrian crossing.

Touching the traffic light reveals a small, interactive explanation of how signals control traffic.

Let the visitor change the lights and observe cars stopping, waiting, and moving appropriately. Include pedestrian crossing signals and teach safe crossing behavior, making clear that children should check for traffic even when their signal permits crossing.

Perhaps the road itself can lift open like a flap, revealing hidden water pipes, drainage tunnels, cables, soil layers, and the extraordinary little world underneath an ordinary street.

**Scene 4 — The Playground of Invisible Forces**

The child reaches a peaceful playground surrounded by trees and warm sunlight.

A colorful ball bounces across the ground.

Let the visitor drop, drag, and release the ball, watching it rise, slow near its highest point, fall, bounce, and gradually lose height.

Beautiful, delicate painted arrows and tiny labels can appear to explain gravity, speed, motion, and energy in words a six-year-old can understand.

Allow discovery through movement rather than long explanations. Perhaps a swing reveals how back-and-forth motion works, or a seesaw demonstrates balance.

**Scene 5 — The Little Wonder of Everything**

End with the child sitting beneath a tree in the afternoon, watching clouds drift overhead.

Around them are the ordinary things encountered throughout the day: a clock, warm toast, a passing car, a bouncing ball.

The child realizes that the world is full of invisible stories.

End with a quiet, beautiful feeling of curiosity rather than a score, achievement, or lesson-complete screen.

## The Art Direction

**The artwork is the soul of this project.**

Make every scene look like an exquisite, lovingly illustrated children's picture book. Think delicate watercolor washes, soft gouache textures, fine pencil lines, warm ivory paper, expressive brushstrokes, gentle shadows, rich environmental details, and wonderfully composed paintings.

The characters should feel endearing and natural, with subtle expressions and small believable movements.

The world should have a timeless, nostalgic beauty, like discovering an extraordinary illustrated book from childhood.

Every scene should be beautiful enough to frame as a painting.

Avoid generic vector graphics, cheap cartoons, flat UI illustrations, harsh 3D visuals, and the appearance of an ordinary educational app.

## The Magic of Interaction

The experience should revolve around **curiosity, not instructions**.

A visitor notices something interesting, touches it, and watches the illustration respond.

Objects might unfold like paper mechanisms, reveal transparent layers, open into intricate cross-sections, or gently enlarge into beautiful illustrated explanations.

The clock hands should truly move. The toaster's internal parts should visibly demonstrate their functions. Traffic should respond logically to the signals. The ball should move according to understandable physical principles.

Make interactions tactile, surprising, accurate, and delightful.

Keep explanations extremely short, clear, and age-appropriate. Use beautiful little labels, arrows, diagrams, and animations rather than long paragraphs.

Allow the visitor to return to an illustration, experiment again, and discover something new.

## Storytelling and Atmosphere

The story should flow naturally from bedroom to kitchen, street, playground, and finally a quiet afternoon beneath a tree.

Use lovely transitions that feel like turning pages in a real storybook.

Let the environments breathe: morning birdsong, ticking clocks, rustling leaves, distant neighborhood sounds, gentle footsteps, and the satisfying mechanical sounds of objects.

No forced narration, quizzes, missions, timers, rewards, or distractions.

Learning should happen almost accidentally through wonder.

## Experience and Implementation

Build this as a **complete, polished interactive experience contained in one HTML file**, with everything necessary to run it.

You have complete freedom to choose the rendering techniques, creative implementation, animation methods, and internal architecture. Prefer lightweight approaches and avoid unnecessarily large frameworks or dependencies.

Make it exceptionally beautiful and intuitive on mobile, while equally delightful on desktop. Support touch, dragging, clicking, and natural scene navigation.

Use the entire available screen as an illustrated canvas. Keep any interface extremely minimal, elegant, and integrated into the storybook aesthetic.

Ensure smooth animations, readable labels, responsive compositions, and genuinely working educational interactions.

Do not create a static mockup or a series of decorative screens. **Build the actual living storybook.**

## The Feeling I Want

Imagine a six-year-old discovering for the first time that the world isn't just made of things — it's made of fascinating little mysteries.

A clock isn't merely ticking; it's telling a story about time.

A toaster isn't just making breakfast; there's an entire mechanism hidden inside.

A traffic light isn't simply changing colors; it's helping people share the road safely.

A bouncing ball isn't merely moving; invisible forces are shaping its journey.

I want visitors to feel the childhood excitement of opening a beautiful lift-the-flap encyclopedia, combined with the warmth of a hand-painted bedtime story.

**Make it so visually beautiful that adults feel nostalgic, so intuitive that children can explore it, and so thoughtfully crafted that every little discovery feels magical.**

The goal isn't to teach everything.

It's to make a child look at an ordinary object afterward and wonder:

**"I wonder what's happening inside that?"**

'use strict';
/* ───────────── A Little Day of Wonder ─────────────
   Everything is painted by hand, in code: watercolour washes are layered
   wobbly polygons, pencil lines are jittered strokes, paper is noise.   */
const cv=document.getElementById('c'),X=cv.getContext('2d'),story=document.getElementById('story');
const PAPER='#f4ecda',INK='#4a382f',FONT='"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",P052,Georgia,serif';
const TAU=Math.PI*2,PI=Math.PI,sin=Math.sin,cos=Math.cos,abs=Math.abs,min=Math.min,max=Math.max,hyp=Math.hypot;
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const QS=new URLSearchParams(location.search);
let W,H,DPR,S,K,VW,VH,PT,F={},T=0,DT=0,tf=1,QN=3;
let bgs=[],sprites={},mask,grain;

/* seeded randomness for paint (logic uses Math.random) */
let R=mk(1);
function mk(s){s>>>=0;return()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* colour */
const CC={},MM=new Map();
function rgb(h){return CC[h]||(CC[h]=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)])}
function mix(a,b,t){t=clamp(t);const k=a+b+((t*48)|0);let v=MM.get(k);if(!v){const A=rgb(a),B=rgb(b);v='#'+[0,1,2].map(i=>Math.round(A[i]+(B[i]-A[i])*t).toString(16).padStart(2,'0')).join('');MM.set(k,v)}return v}
const dark=(c,t)=>mix(c,'#2e201c',t),lite=(c,t)=>mix(c,'#fffaf0',t);
const rgba=(h,a)=>{const v=rgb(h);return`rgba(${v[0]},${v[1]},${v[2]},${a})`};
function keyMix(k,h){for(let i=1;i<k.length;i++)if(h<=k[i][0]){const a=k[i-1],b=k[i];return mix(a[1],b[1],(h-a[0])/(b[0]-a[0]||1))}return k[k.length-1][1]}

/* point helpers */
function P(...n){const o=[];for(let i=0;i<n.length;i+=2)o.push([n[i],n[i+1]]);return o}
const B=(x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
function E(cx,cy,rx,ry,n=18,rot=0){const o=[],cr=cos(rot),sr=sin(rot);for(let i=0;i<n;i++){const a=i/n*TAU,x=cos(a)*rx,y=sin(a)*ry;o.push([cx+x*cr-y*sr,cy+x*sr+y*cr])}return o}
function rough(pts,r,closed=true){const o=[],n=pts.length;for(let i=0;i<n;i++){const a=pts[i];o.push([a[0]+jit(r),a[1]+jit(r)]);if(!closed&&i===n-1)break;
  const b=pts[(i+1)%n],d=hyp(b[0]-a[0],b[1]-a[1]);if(d>16){const k=min(9,(d/16)|0);for(let j=1;j<=k;j++){const t=j/(k+1);o.push([a[0]+(b[0]-a[0])*t+jit(r),a[1]+(b[1]-a[1])*t+jit(r)])}}}return o}
function trace(c,p,closed=true){const n=p.length;c.beginPath();
  if(closed){c.moveTo((p[n-1][0]+p[0][0])/2,(p[n-1][1]+p[0][1])/2);for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n];c.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}c.closePath()}
  else{c.moveTo(p[0][0],p[0][1]);for(let i=1;i<n-1;i++){const a=p[i],b=p[i+1];c.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}c.lineTo(p[n-1][0],p[n-1][1])}}

/* watercolour wash: a soft core, feathered layers, and a pooled darker edge */
function wash(c,pts,col,o={}){const a=o.a??.92,n=o.n??QN,r=o.r??2;c.save();c.fillStyle=col;
  c.globalAlpha=a*.84;trace(c,rough(pts,r*.35));c.fill();
  const la=1-Math.pow(1-min(.98,a*.72),1/n);c.globalAlpha=la;
  for(let i=0;i<n;i++){trace(c,rough(pts,r*(.6+i*.3)));c.fill()}
  if(o.edge!==0){c.globalAlpha=(o.edge??.2)*a;c.strokeStyle=dark(col,.3);c.lineWidth=o.ew??1.2;trace(c,rough(pts,r*.5));c.stroke()}
  c.restore()}
function pencil(c,pts,o={}){const cl=!!o.closed,n=o.n??2;c.save();c.strokeStyle=o.col||INK;c.lineCap='round';c.lineJoin='round';
  for(let k=0;k<n;k++){c.globalAlpha=(o.a??.5)*(k?.55:1);c.lineWidth=(o.w??.95)*(k?.7:1);trace(c,rough(pts,o.r??.8,cl),cl);c.stroke()}c.restore()}
function shape(c,pts,col,o={}){wash(c,pts,col,o);pencil(c,pts,{closed:true,a:o.pa??.5,r:(o.r??2)*.45,n:o.pn??2,w:o.pw})}
function glow(c,x,y,r,col,a=1,op){c.save();if(op)c.globalCompositeOperation=op;const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(col,a));g.addColorStop(.55,rgba(col,a*.45));g.addColorStop(1,rgba(col,0));c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);c.restore()}
function mottle(c,pts,cols,k=12,r0=30,r1=90,a=.14){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of pts){x0=min(x0,p[0]);y0=min(y0,p[1]);x1=max(x1,p[0]);y1=max(y1,p[1])}
  c.save();trace(c,pts);c.clip();for(let i=0;i<k;i++)glow(c,rnd(x0,x1),rnd(y0,y1),rnd(r0,r1),cols[i%cols.length],a);c.restore()}
function limb(c,pts,w,col){c.save();c.lineCap='round';c.lineJoin='round';trace(c,pts,false);c.strokeStyle=INK;c.globalAlpha=.5;c.lineWidth=w+1.7;c.stroke();c.globalAlpha=1;c.strokeStyle=col;c.lineWidth=w;c.stroke();c.restore()}
const line=(c,x1,y1,x2,y2,o)=>pencil(c,[[x1,y1],[x2,y2]],o);
function dot(c,x,y,r,col=INK,a=1){c.save();c.globalAlpha=a;c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();c.restore()}
function txt(c,s,x,y,size,o={}){if(!o.raw)size*=tf;c.save();c.font=(o.up?'':'italic ')+(o.b?'600 ':'')+size+'px '+FONT;c.textAlign=o.al||'center';c.textBaseline='middle';const a=o.a??1;
  if(o.halo!==0){c.strokeStyle=o.hc||PAPER;c.lineWidth=size*.46;c.lineJoin='round';c.globalAlpha=a*(o.halo??.9);c.strokeText(s,x,y)}
  c.globalAlpha=a;c.fillStyle=o.col||INK;c.fillText(s,x,y);c.restore()}
function lines(c,s,x,y,size,o={}){const L=s.split('\n'),lh=size*tf*1.28;L.forEach((l,i)=>txt(c,l,x,y+(i-(L.length-1)/2)*lh,size,o))}
/* a little label with a pencil leader to the thing it names */
function tag(c,s,x,y,tx,ty,a=1,size=14,o={}){if(a<=.01)return;seed(77);const d=hyp(tx-x,ty-y),k=min(1,(size*tf*.9)/d);
  pencil(c,[[x+(tx-x)*k,y+(ty-y)*k],[(x+tx)/2+(ty-y)*.08,(y+ty)/2-(tx-x)*.08],[tx,ty]],{a:.6*a,n:1,w:1,col:o.col});dot(c,tx,ty,2.2,o.col||INK,.7*a);txt(c,s,x,y,size,{a,...o})}

  for(let k=0;k<2;k++){c.lineWidth=w*(k?.5:1);c.globalAlpha=a*(k?.5:.8);c.beginPath();c.moveTo(x1+jit(.6),y1+jit(.6));c.quadraticCurveTo((x1+x2)/2+uy*d*.04,(y1+y2)/2-ux*d*.04,x2,y2);
    c.moveTo(x2-ux*h-uy*h*.6,y2-uy*h+ux*h*.6);c.lineTo(x2,y2);c.lineTo(x2-ux*h+uy*h*.6,y2-uy*h-ux*h*.6);c.stroke()}c.restore()}
/* tiny golden glints that say "something here is curious" */
/* the dotted cut-line of a paper flap: "you can lift this" */
function flapMark(c,x,y,w,h,o={}){const a=(o.a??1)*(.8+.2*sin(T*2.2+x*.013)),r=min(o.r??11,w/2,h/2);c.save();c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);
  c.fillStyle='rgba(255,250,230,'+.2*a+')';c.fill();c.lineWidth=3.6;c.strokeStyle='rgba(255,250,230,'+.8*a+')';c.stroke();c.setLineDash([7,5.5]);c.lineCap='round';c.lineWidth=1.5;c.strokeStyle='rgba(74,56,47,'+.75*a+')';c.stroke();c.restore();
  if(!o.nc){const z=min(13,w*.28,h*.28);c.save();c.globalAlpha=a;curl(c,x+w-1,y+h-1,-1,z);c.restore()}}
function spark(c,x,y,a=1,ph=0){for(let i=0;i<3;i++){const t=(T*.55+ph+i/3)%1,k=sin(t*PI),ang=i*2.1+ph*3,r=16+i*7,px=x+cos(ang)*r,py=y+sin(ang)*r-t*8,z=(3+i)*k;
  c.save();c.globalAlpha=a*k*.9;c.fillStyle='#f3c24f';c.strokeStyle='#fff7d8';c.lineWidth=.8;c.beginPath();c.moveTo(px,py-z*1.7);c.quadraticCurveTo(px,py,px+z*1.7,py);c.quadraticCurveTo(px,py,px,py+z*1.7);c.quadraticCurveTo(px,py,px-z*1.7,py);c.quadraticCurveTo(px,py,px,py-z*1.7);c.fill();c.stroke();c.restore()}}
function wisp(c,x,y,ph,a=1,h=60){for(let i=0;i<3;i++){const t=(T*.35+ph+i/3)%1,pts=[];for(let j=0;j<6;j++){const u=j/5;pts.push([x+(i-1)*9+sin(u*5+T*1.5+i*2+ph*9)*(4+u*7),y-t*h*.5-u*h*.6])}
  c.save();c.globalAlpha=a*sin(t*PI)*.5;c.strokeStyle='#fffdf6';c.lineWidth=3.2;c.lineCap='round';trace(c,pts,false);c.stroke();c.lineWidth=1;c.strokeStyle='#b9ab98';c.globalAlpha*=.6;c.stroke();c.restore()}}

  for(let i=0;i<5*m*m;i++){const a=rnd(TAU),d=Math.sqrt(R())*r*.8;glow(c,cx+cos(a)*d,cy+sin(a)*d*.78-r*.1,rnd(18,40),'#e6efb0',.2)}
  for(let i=0;i<min(300,46*m*m);i++){const a=rnd(TAU),d=Math.sqrt(R())*r*.97,x=cx+cos(a)*d,y=cy+sin(a)*d*.8;wash(c,E(x,y,rnd(3,6.5),rnd(1.8,3.2),7,rnd(3)),i%3?dark(cols[0],rnd(.05,.3)):lite(cols[1],.35),{a:.6,n:2,r:.7,edge:0})}
  for(let i=0;i<7*m*m;i++){const a=rnd(TAU),d=rnd(.15,.85)*r,x=cx+cos(a)*d,y=cy+sin(a)*d*.75,q=rnd(10,22);pencil(c,[[x-q,y+3],[x-q*.4,y-q*.5],[x+q*.3,y-q*.45],[x+q,y+4]],{a:.28,n:1})}}

  wash(c,E(cx,cy+w*.07,w*.55,w*.07,14),'#d9dde6',{a:.3,edge:0,r:3})}

/* ───── things that travel through the whole book ───── */
function ball(c,x,y,r,rot=0,sq=1){c.save();c.translate(x,y);c.scale(1/Math.sqrt(sq),sq);seed(21);
  wash(c,E(0,0,r,r,20),'#fbf3df',{r:r*.03,edge:0});c.save();c.beginPath();c.arc(0,0,r,0,TAU);c.clip();c.rotate(rot);const cs=['#d9614a','#f0c456','#5f93a8'];
  for(let i=0;i<3;i++){const a0=i*TAU/3,pts=[[0,0]];for(let j=0;j<=6;j++){const a=a0+j/6*TAU/6;pts.push([cos(a)*r*1.2,sin(a)*r*1.2])}wash(c,pts,cs[i],{n:2,r:r*.03,edge:0,a:.95})}
  dot(c,0,0,r*.13,'#fbf3df');c.restore();glow(c,-r*.35,-r*.4,r*.5,'#ffffff',.5);

  if(turn)return;if(p.y>VH-84&&p.x>VW-84&&cur<scenes.length-1){ptr.nav=1;go(1);return}if(p.y>VH-84&&p.x<84&&cur>0){ptr.nav=1;go(-1);return}
  ptr.cap=!!(scenes[cur].down&&scenes[cur].down(p.x,p.y))});
cv.addEventListener('pointermove',e=>{const p=vp(e);if(ptr.down&&ptr.cap&&scenes[cur].move)scenes[cur].move(p.x,p.y);
  else if(!ptr.down)cv.style.cursor=(p.y>VH-84&&(p.x>VW-84||p.x<84))||(scenes[cur].hot&&scenes[cur].hot(p.x,p.y))?'pointer':'default'});
const pup=e=>{if(!ptr.down)return;const p=vp(e);ptr.down=false;if(ptr.nav)return;if(ptr.cap){scenes[cur].up&&scenes[cur].up(p.x,p.y);return}
  const dx=p.x-ptr.x0,dy=p.y-ptr.y0;if(abs(dx)>90&&abs(dx)>abs(dy)*2&&performance.now()-ptr.t0<700)go(dx<0?1:-1)};
