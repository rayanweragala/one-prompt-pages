# THE OCEAN ABOVE THE CLOUDS

### A place where the sky becomes the ground

Create an impossibly beautiful, peaceful, first-person world where the visitor walks across an infinite ocean of shallow, crystal-clear water suspended high above the clouds.

Imagine opening your eyes to discover that the ground beneath you is a perfect mirror of the sky. Soft lavender, pearl white, pale rose, and golden peach stretch endlessly toward the horizon. Beneath the transparent water, enormous clouds move slowly through a bottomless blue atmosphere. There is no visible Earth, only sky above and sky below.

Each step sends delicate circular ripples across the reflective surface. Water gently moves around the visitor's feet. Soft wind travels across the ocean, slightly disturbing its mirror-like perfection. The atmosphere feels enormous yet intimate, as though the visitor is standing at the edge of infinity.

Far away, mysterious floating islands emerge from the clouds. Some carry enormous ancient trees with silver leaves. Others hold quiet waterfalls that descend into the sky and disappear. Occasionally, distant birds glide between cloud layers, and tiny glowing particles drift above the water like fallen stars.

Allow free exploration, natural 360-degree observation, and gentle walking across this impossible landscape. The visitor can approach the floating islands, explore their peaceful surroundings, and discover breathtaking new perspectives.

**Give the sky a life of its own.** Slowly drifting cloud formations, delicate atmospheric haze, changing reflections, soft shafts of sunlight, and subtle transitions in color. Sometimes a colossal, indistinct shadow moves far beneath the clouds. It should inspire wonder, never fear. Perhaps it is a whale swimming through the sky. Perhaps it is something nobody has ever named.

There must be no objectives, enemies, menus, or distractions. This world exists purely for the experience of being there.

Prioritize extraordinary artistic composition, convincing water reflections, beautiful atmosphere, immersive environmental sound, seamless exploration, and an exceptional mobile-first experience. Choose all technologies freely. Make the entire screen feel like a living dream.

**My most important request:** I want to stop walking, look straight down into the water, watch enormous clouds drifting thousands of meters beneath my feet, then slowly raise my eyes toward an infinite pastel horizon and feel unbelievably small, but completely free.

*There is nowhere to fall. There is nowhere to arrive. Only the sky, and the feeling of being part of it.*

  cam.x+=cam.vx*dt;cam.z+=cam.vz*dt;

  const spd=Math.hypot(cam.vx,cam.vz),SL=.72+.11*spd,st0=Math.floor(cam.stride);cam.stride+=spd*dt/SL;
  const sy=Math.sin(cam.yaw),cy=Math.cos(cam.yaw);
  if(Math.floor(cam.stride)!==st0&&spd>.3){const sd=st0&1?1:-1;ripple(cam.x+cy*sd*.15+cam.vx*.12,cam.z+sy*sd*.15+cam.vz*.12,.75+.07*spd);footstep(st0&1,spd);}
  if(spd<.25){if((stillT+=dt)>5.2){stillT=0;ripple(cam.x,cam.z,.4);}}else stillT=3.5;
  if(inside&&(starT-=dt)<0){starT=2.2+4.5*Math.random();const a=cam.yaw+(Math.random()-.5)*2.4,r=3+11*Math.random();
    ripple(cam.x+Math.sin(a)*r,cam.z-Math.cos(a)*r,.45);chime(a-cam.yaw,r);}

  cam.y=EYE+cam.bob*.03*Math.sin(ph*2+1.2)+(calm?0:.008*Math.sin(time*.9));cam.side=cam.bob*.018*Math.sin(ph);

    const a=Q.has('whale')?cam.yaw:Math.random()*TAU,first=!whale.done,R=first?1500:2700,off=(Math.random()<.5?-1:1)*(first?150:200+500*Math.random());
    whale.hd=a+Math.PI;whale.x=cam.x+Math.sin(a)*R+Math.cos(a)*off;whale.z=cam.z-Math.cos(a)*R+Math.sin(a)*off;
    whale.len=R*2;whale.trav=+Q.get('whale')||0;whale.x+=Math.sin(whale.hd)*whale.trav;whale.z-=Math.cos(whale.hd)*whale.trav;whale.go=true;whale.called=false;whale.done=true;}

    if(whale.trav>whale.len){whale.go=false;whale.vis=0;whale.next=time-enterT+55+Math.random()*70;}}

  let bi=0;
  flocks.forEach((F,fi)=>{F.hd+=F.cv*dt;const fx=Math.sin(F.hd),fz=-Math.cos(F.hd);F.x+=fx*F.sp*dt;F.z+=fz*F.sp*dt;
    if(Math.hypot(F.x-cam.x,F.z-cam.z)>(F.below?1000:2600))respawn(F,false);
    for(let i=0;i<F.n;i++,bi++){const row=Math.ceil(i/2),sd=i%2?1:-1,lat=sd*row*(F.below?7:3.3)+Math.sin(time*.3+i*2)*.6,back=-row*(F.below?6:2.7);

}

  gl.depthMask(false);
  P=PR.fall;gl.useProgram(P.p);gl.bindVertexArray(fallVAO);
  for(const F of vfalls){gl.uniform3f(P.u.uTop,F.x-cam.x,F.y,F.z-cam.z);gl.uniform4f(P.u.uFO,F.ox,F.oz,F.y,F.w);gl.uniform1f(P.u.uSeed,F.seed);gl.drawElements(gl.TRIANGLES,fallCount,gl.UNSIGNED_SHORT,0);}
  P=PR.spr;gl.useProgram(P.p);
  if(mistN){gl.uniform1i(P.u.uMode,1);gl.bindVertexArray(mistVAO);if(mirror>0){gl.bindBuffer(gl.ARRAY_BUFFER,mistBuf);gl.bufferSubData(gl.ARRAY_BUFFER,0,mistData);}gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,mistN);}
  gl.uniform1i(P.u.uMode,0);gl.uniform2f(P.u.uWd,windX*.3%WRAP,windZ*.3%WRAP);gl.bindVertexArray(sprVAO);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,MOTES);
  gl.depthMask(true);gl.disable(gl.BLEND);
}
function draw(){
  frameState();
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,noiseTex);
  /* first the world upside down, for the water to hold */
  gl.bindFramebuffer(gl.FRAMEBUFFER,refFB);gl.viewport(0,0,rw,rh);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.bindBuffer(gl.ARRAY_BUFFER,birdBufGL);gl.bufferSubData(gl.ARRAY_BUFFER,0,birdData);
  if(mistN){gl.bindBuffer(gl.ARRAY_BUFFER,mistBuf);gl.bufferSubData(gl.ARRAY_BUFFER,0,mistData);}
  drawWorld(-1);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,Hh);
  const P=PR.world,u=P.u;setCommon(P,1);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,refTex);gl.uniform1i(u.uRef,1);gl.activeTexture(gl.TEXTURE0);
  gl.uniform4fv(u.uRip,ripU);gl.uniform4fv(u.uFall,fallU);
  gl.uniform4f(u.uWhale,whale.x-cam.x,whale.z-cam.z,Math.sin(whale.hd),-Math.cos(whale.hd));gl.uniform1f(u.uWhV,whale.vis);
  /* every cloud deck drifts on its own wind; offsets are kept small so the far side of the ocean is as sharp as the near */
  const t=time,o=(x,z,vx,vz,tile)=>[fr((x+vx*t)/tile),fr((z+vz*t)/tile)];
  gl.uniform2fv(u.uO1,o(cam.x,cam.z,17,6,5200));gl.uniform2fv(u.uO2,o(cam.x,cam.z,9,-4,9000));gl.uniform2fv(u.uO3,o(cam.x,cam.z,4,3,17000));
  gl.uniform2f(u.uOc,fr(t*.0004),fr(t*.00023));gl.uniform2f(u.uOd,fr(t*.0021),fr(-t*.0013));
  gl.uniform2f(u.uOw,fr(windX*.045),fr(windZ*.045));gl.uniform2f(u.uOp,fr(windX*.012),fr(windZ*.012));
  gl.uniform2f(u.uOci,fr(t*.0011),fr(t*.0004));gl.uniform1f(u.uOh,fr(t*.0005));
  gl.disable(gl.DEPTH_TEST);gl.depthMask(false);gl.bindVertexArray(quadVAO);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  drawWorld(1);
}
let ema=16,hold=0,fell=false;
function loop(now){
  const raw=now-last,ms=clamp(raw,0,100),dt=Math.min(.05,ms/1000);last=now;
  step(dt);draw();audioTick(dt);
  if(!Q.has('q')&&raw<200){ema+=(ms-ema)*.06;hold+=dt;
    if(hold>1.6&&ema>23&&scale>.45){scale*=.86;fell=true;hold=0;ema=17;resize();}
    else if(hold>8&&ema<17.4&&scale<maxScale&&!fell){scale=Math.min(maxScale,scale*1.1);hold=0;resize();}}
  requestAnimationFrame(loop);
}

/* ---------------- sound: air, water, leaves, and a few things far away ---------------- */
let AC=null,master=null,muted=false,A={},audT=0;
function audioStart(){
  if(AC||muted)return;const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
  AC=new Ctx();const sr=AC.sampleRate;
  master=AC.createGain();master.gain.value=0;
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3;comp.attack.value=.03;comp.release.value=.5;
  master.connect(comp);comp.connect(AC.destination);master.gain.setTargetAtTime(.9,AC.currentTime+.1,2.2);
  const mk=(sec,fn)=>{const b=AC.createBuffer(2,sec*sr|0,sr);for(let c=0;c<2;c++)fn(b.getChannelData(c));return b;};
  A.white=mk(5,d=>{for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;});
  A.brown=mk(7,d=>{let v=0;for(let i=0;i<d.length;i++){v=(v+.02*(Math.random()*2-1))/1.02;d[i]=v*3.4;}});
  const src=(b,rate)=>{const s=AC.createBufferSource();s.buffer=b;s.loop=true;s.playbackRate.value=rate;s.start(0,Math.random()*b.duration);return s;};
  const filt=(type,f,q)=>{const b=AC.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q||.7;return b;};
  const gain=v=>{const g=AC.createGain();g.gain.value=v;return g;};
  const chain=(...n)=>{for(let i=0;i<n.length-1;i++)n[i].connect(n[i+1]);return n[n.length-1];};
  A.gain=gain;A.filt=filt;A.chain=chain;
  /* a long soft echo, as if the sky had walls very far away */
  A.verb=gain(1);const d1=AC.createDelay(1),d2=AC.createDelay(1),fb=gain(.5),lp=filt('lowpass',2100),out=gain(.55);d1.delayTime.value=.37;d2.delayTime.value=.53;
  chain(A.verb,d1,lp,d2,fb,d1);d1.connect(out);d2.connect(out);out.connect(master);
  A.wind=gain(0);A.windF=filt('bandpass',320,.7);chain(src(A.brown,1.1),A.windF,A.wind,master);
  A.air=gain(.004);chain(src(A.white,1),filt('highpass',4800),filt('lowpass',9500),A.air,master);
  A.lap=gain(0);A.lapF=filt('bandpass',620,.9);chain(src(A.white,.7),A.lapF,A.lap,master);
  A.fall=gain(0);A.fallP=AC.createStereoPanner();chain(src(A.white,.9),filt('lowpass',2600,.5),filt('highpass',160),A.fall,A.fallP,master);
  A.leaf=gain(0);A.leafP=AC.createStereoPanner();chain(src(A.white,1.2),filt('bandpass',5200,.5),A.leaf,A.leafP,master);
  /* the wind finds a few notes in the open air */
  A.pad=[110,164.81,277.18,329.63,493.88].map((f,i)=>{const o=AC.createOscillator(),g=gain(0),p=AC.createStereoPanner();o.frequency.value=f;o.detune.value=(i-2)*3;p.pan.value=(i-2)*.3;
    chain(o,g,p,master);g.connect(A.verb);o.start();return{g,t:2+i*3,on:false};});
}
function audioTick(dt){
  if(!AC||AC.state!=='running')return;const now=AC.currentTime;
  if((audT+=dt)<.1)return;const span=audT;audT=0;
  const spd=Math.hypot(cam.vx,cam.vz);
  A.wind.gain.setTargetAtTime(.035+.3*gust*gust,now,.6);A.windF.frequency.setTargetAtTime(240+380*gust,now,.6);
  A.air.gain.setTargetAtTime(.003+.006*gust,now,.5);
  A.lap.gain.setTargetAtTime(.006+.012*(.5+.5*Math.sin(time*1.3)*Math.sin(time*.37))+.01*Math.min(1,spd/3),now,.25);
  A.lapF.frequency.setTargetAtTime(520+200*Math.sin(time*.8),now,.3);
  const fd=near.fallD;A.fall.gain.setTargetAtTime(.4/(1+Math.pow(fd/38,2)),now,.3);A.fallP.pan.setTargetAtTime(clamp(Math.sin(near.fallAz-cam.yaw)*.85,-1,1)*Math.min(1,fd/12),now,.1);
  const td=near.treeD;A.leaf.gain.setTargetAtTime((.006+.05*gust*gust)/(1+Math.pow(td/110,2)),now,.4);A.leafP.pan.setTargetAtTime(clamp(Math.sin(near.treeAz-cam.yaw)*.8,-1,1)*Math.min(1,td/40),now,.1);
  for(const p of A.pad){if((p.t-=span)<0){p.on=!p.on;p.t=p.on?6+9*Math.random():5+16*Math.random();p.g.gain.setTargetAtTime(p.on?.006+.012*Math.random():0,now,p.on?3:4);}}
}
function tone(f0,f1,dur,vol,pan,att,wet){
  const o=AC.createOscillator(),g=A.gain(0),p=AC.createStereoPanner(),t=AC.currentTime+.02;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  p.pan.value=clamp(pan,-1,1);A.chain(o,g,p,master);const w=A.gain(wet);p.connect(w);w.connect(A.verb);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0003,t+dur);o.start(t);o.stop(t+dur+.05);return{o,t};
}
function chime(az,r){if(!AC||AC.state!=='running')return;const f=[880,987.77,1108.73,1318.51,1479.98,1760][Math.random()*6|0],v=.02/(1+r*.12),pan=Math.sin(az)*.7;
  tone(f,f*.998,2.6,v,pan,.006,.9);tone(f*2.76,f*2.75,.9,v*.25,pan,.004,.6);}
function footstep(side,spd){
  /* a foot pushing through shallow water: a soft slosh that opens and closes, a trickle running off, a few drops */
  if(!AC||AC.state!=='running')return;const now=AC.currentTime+.01,pan=AC.createStereoPanner(),v=.75+.07*spd;pan.pan.value=side?.22:-.22;pan.connect(master);
  const noise=(rate)=>{const s=AC.createBufferSource();s.buffer=A.white;s.playbackRate.value=rate;s.start(now,Math.random()*4);s.stop(now+.9);return s;};
  const f0=300+Math.random()*120,sl=A.filt('bandpass',f0,1.4),g=A.gain(0);A.chain(noise(.6+Math.random()*.2),sl,A.filt('lowpass',1400,.5),g,pan);
  sl.frequency.setValueAtTime(f0,now);sl.frequency.exponentialRampToValueAtTime(f0*2,now+.16);sl.frequency.exponentialRampToValueAtTime(f0*1.3,now+.5);
  g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.034*v,now+.09);g.gain.exponentialRampToValueAtTime(.0004,now+.55);
  const lo=A.filt('lowpass',300,.7),gl2=A.gain(0);A.chain(noise(.5),lo,gl2,pan);
  gl2.gain.setValueAtTime(0,now);gl2.gain.linearRampToValueAtTime(.022*v,now+.06);gl2.gain.exponentialRampToValueAtTime(.0004,now+.3);
  const tr=A.filt('bandpass',1500+Math.random()*500,1),gt=A.gain(0),n=24,curve=new Float32Array(n);
  for(let i=0;i<n;i++){const e=Math.sin(Math.PI*Math.pow(i/(n-1),.6));curve[i]=.005*v*e*(.35+.65*Math.random());}curve[0]=curve[n-1]=0;
  A.chain(noise(1.1),tr,gt,pan);gt.gain.setValueCurveAtTime(curve,now+.04,.62);
  for(let i=0,k=1+(Math.random()*2|0);i<k;i++){const o=AC.createOscillator(),d=A.gain(0),t=now+.1+Math.random()*.45,f=700+1500*Math.random();
    o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.7,t+.035);A.chain(o,d,pan);
    d.gain.setValueAtTime(0,t);d.gain.linearRampToValueAtTime(.004*v*(.4+Math.random()),t+.004);d.gain.exponentialRampToValueAtTime(.0002,t+.05);o.start(t);o.stop(t+.07);}
}
function whaleSong(az){if(!AC||AC.state!=='running')return;const pan=Math.sin(az)*.6;
  const note=(f0,f1,dl,dur)=>setTimeout(()=>{if(AC.state!=='running')return;tone(f0,f1,dur,.07,pan,dur*.35,.9);tone(f0*2.01,f1*2.01,dur,.012,pan,dur*.4,.9);},dl*1000);
  note(98,146.8,0,4.2);note(146.8,123.5,4.6,3.6);note(110,164.8,9.5,5);}
function birdCall(az,d){if(!AC||AC.state!=='running')return;const pan=Math.sin(az)*.8,v=.02/(1+d/300),n=2+(Math.random()*3|0),f=1500+900*Math.random();
  for(let i=0;i<n;i++)setTimeout(()=>{if(AC.state==='running')tone(f*(1+.08*Math.random()),f*.72,.22,v,pan,.02,1);},i*(260+80*Math.random()));}
const snd=$('#snd');
function toggleSound(){muted=!muted;snd.setAttribute('aria-pressed',String(!muted));
  if(!muted&&!AC)audioStart();else if(master)master.gain.setTargetAtTime(muted?0:.9,AC.currentTime,.4);}
snd.addEventListener('click',()=>{toggleSound();cv.focus();});
document.addEventListener('visibilitychange',()=>{if(AC)document.hidden?AC.suspend():AC.resume();last=performance.now();});

/* ---------------- threshold ---------------- */
const veil=$('#veil'),brief=$('#brief'),hint=$('#hint');let briefOpen=false,ready=false;
function setBrief(v){briefOpen=v;brief.classList.toggle('open',v);brief.setAttribute('aria-hidden',String(!v));if(v)$('#briefX').focus();}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
$('#briefBody').innerHTML=$('#promptSrc').textContent.trim().split(/\n\s*\n/).map(p=>{const h=/^#+\s*/.test(p),t=esc(p.replace(/^#+\s*/,'')).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
  return h?'<h3>'+t+'</h3>':'<p>'+t+'</p>';}).join('');
$('#briefBtn').addEventListener('click',e=>{e.stopPropagation();setBrief(true);});
$('#briefX').addEventListener('click',()=>setBrief(false));brief.addEventListener('click',e=>{if(e.target===brief)setBrief(false);});
if(/prompt/.test(location.hash))setBrief(true);
function enter(){
  if(!ready||inside)return;inside=true;enterT=time;veil.classList.add('gone');snd.classList.add('on');audioStart();cv.focus();
  hint.textContent=coarse?'left thumb to walk · right thumb to look · look down':'click to look around · W A S D to walk · look down';
  setTimeout(()=>hint.classList.add('on'),2800);setTimeout(()=>hint.classList.remove('on'),13000);
}
veil.addEventListener('click',enter);

setTimeout(()=>{
  try{buildGL();}catch(err){console.error(err);const n=$('#nogl');n.textContent='The sky could not open here: '+String(err.message||err).split('\n')[0];n.style.display='grid';veil.style.display='none';cv.style.display='none';return;}
  if(Q.has('go')){inside=true;enterT=time;veil.style.display='none';
    if(Q.has('x')){cam.x=+Q.get('x');cam.z=+Q.get('z')||0;}
    if(Q.has('yaw'))cam.yaw=cam.yawT=(+Q.get('yaw'))*DEG;
    cam.pitch=cam.pitchT=(+Q.get('pitch')||0)*DEG;
    if(Q.has('rip'))for(let i=0;i<5;i++)rip[ripN++]={x:cam.x+(i-2)*.9,z:cam.z-1.5-i*.8,t:time+(+Q.get('rip'))-i*.9,a:.8};}
  if(Q.has('dbg'))window.__sky={cam,whale,flocks,near,get scale(){return scale;},get ema(){return ema;},get visible(){return visible;}};
  resize();ready=true;veil.classList.add('ready');$('#go').textContent=coarse?'touch to open your eyes':'click to open your eyes';
  last=performance.now();requestAnimationFrame(loop);
},60);
})();
